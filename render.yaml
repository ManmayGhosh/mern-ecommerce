# Render Blueprint — deploys the database, backend API, and static frontend
# together. In the Render dashboard: New > Blueprint > point at this repo.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: shopeasy-db
    databaseName: ecommerce_db
    user: ecommerce
    plan: free

services:
  - type: web
    name: shopeasy-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopeasy-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://shopeasy-frontend.onrender.com"

  - type: web
    name: shopeasy-frontend
    runtime: static
    staticPublishPath: ./frontend/public
    # Render assigns https://<service-name>.onrender.com, which is
    # predictable from the name above, so we can bake the backend URL in
    # at build time instead of editing config.js by hand.
    buildCommand: >
      echo "window.__API_BASE__ = 'https://shopeasy-backend.onrender.com/api';"
      > ./frontend/public/js/config.js
    envVars: []
